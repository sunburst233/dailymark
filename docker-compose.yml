services:
  dailymark:
    build: .
    image: dailymark:latest
    container_name: dailymark
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DAILYMARK_API_KEY: ${DAILYMARK_API_KEY:?DAILYMARK_API_KEY is required}
      TZ: Asia/Tokyo
    volumes:
      - ./data:/data
