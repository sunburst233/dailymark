dailymark:
  api-key: ${DAILYMARK_API_KEY:}
  data-dir: ${DAILYMARK_DATA_DIR:${user.dir}/data}

spring:
  datasource:
    url: jdbc:h2:file:${dailymark.data-dir}/db/dailymark;AUTO_SERVER=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  web:
    resources:
      static-locations: classpath:/static/,file:${dailymark.data-dir}/assets/

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${DAILYMARK_BASE_PATH:}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
